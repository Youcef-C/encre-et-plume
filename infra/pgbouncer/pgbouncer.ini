;; PgBouncer — the connection pooler ARCHITECTURE.md and CLAUDE.md both mandate and that was never
;; actually deployed. Explicit .ini rather than env vars: every timeout below was asked for by name,
;; and a file documents WHY each is set where an env list cannot.

[databases]
;; One entry, pointing at the real Postgres. The app connects to pgbouncer:6432 and cannot tell.
encre_et_plume = host=postgres port=5432 dbname=encre_et_plume

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = plain
auth_file = /etc/pgbouncer/userlist.txt
admin_users = postgres
stats_users = postgres
;; LOCAL DEV ONLY: `plain` + a plaintext userlist is fine against postgres/postgres on a laptop —
;; pgbouncer performs the SCRAM handshake upstream with it. PRODUCTION must use auth_query against
;; pg_shadow (or scram verifiers) and pull the password from secrets, never from a checked-in file.

;; ── Pooling mode ──────────────────────────────────────────────────────────────
;; TRANSACTION mode: a server connection is held only for the length of a transaction, so N stateless
;; API instances share a small server-side pool. Verified safe for this codebase — it uses NO
;; session-scoped Postgres features (no LISTEN/NOTIFY, no session advisory locks, no SET SESSION),
;; which is exactly what transaction mode forbids. Session mode would have bought almost nothing.
pool_mode = transaction
;; Prisma sends prepared statements, which transaction mode cannot share across clients — the app URL
;; carries `?pgbouncer=true` so Prisma disables them. Both halves are required.

;; ── Sizing: the "autoscaler" (user, 2026-08-02 — option (i)) ──────────────────
;; default_pool_size is sized off the 25 interactive `$transaction(async …)` sites in the API: an
;; interactive transaction occupies a server connection for its whole duration, so this must exceed
;; the realistic count of CONCURRENT transactions or they serialise behind each other — a failure mode
;; that looks like latency, not errors, which is why it is reasoned about rather than defaulted.
default_pool_size = 25
;; A warm floor, so a burst does not pay connection setup on every request.
min_pool_size = 5
;; The burst valve: extra connections handed out only once clients have actually been waiting. This is
;; what makes the pool behave like a scaler instead of a fixed cap.
reserve_pool_size = 10
reserve_pool_timeout = 3
;; How many app-side clients may queue in front of the pool. Large on purpose: it is what lets many
;; API instances share the small server-side pool above.
max_client_conn = 500
;; Hard ceiling so the pooler can never itself exhaust Postgres (max_connections = 100 upstream).
max_db_connections = 80

;; ── Timeouts (user, 2026-08-02: "do not wait forever") ────────────────────────
;; A client that cannot get a server connection FAILS FAST instead of hanging forever.
query_wait_timeout = 10
;; Reap idle server connections rather than parking them indefinitely.
server_idle_timeout = 60
;; Recycle server connections periodically, so one cannot accumulate state or leak for days.
server_lifetime = 3600
;; Drop clients that hold a connection while doing nothing.
client_idle_timeout = 300
;; A login that stalls must not occupy a slot.
client_login_timeout = 10

log_connections = 0
log_disconnections = 0
