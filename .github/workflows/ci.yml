name: CI

on:
  push:
    branches: [develop, staging, main]
  pull_request:
    branches: [develop, staging, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  validate:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    outputs:
      has_app: ${{ steps.detect.outputs.has_app }}
    steps:
      - uses: actions/checkout@v5

      - name: Detect monorepo scaffold
        id: detect
        run: |
          if [ -f pnpm-lock.yaml ] && [ -d apps ]; then
            echo "has_app=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_app=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Monorepo not scaffolded yet (no pnpm-lock.yaml / apps/). Skipping build & tests — this is expected until the first /build-story run lands code."
          fi

      - name: Setup pnpm
        if: steps.detect.outputs.has_app == 'true'
        uses: pnpm/action-setup@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        if: steps.detect.outputs.has_app == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        if: steps.detect.outputs.has_app == 'true'
        run: pnpm install --frozen-lockfile

      - name: Lint
        if: steps.detect.outputs.has_app == 'true'
        run: pnpm lint

      - name: Typecheck
        if: steps.detect.outputs.has_app == 'true'
        run: pnpm typecheck

      - name: Unit tests (Jest API + Vitest web)
        if: steps.detect.outputs.has_app == 'true'
        run: pnpm test

      - name: Build
        if: steps.detect.outputs.has_app == 'true'
        run: pnpm build

  e2e:
    name: E2E (Playwright) ${{ matrix.shard }}/4
    needs: validate
    if: needs.validate.outputs.has_app == 'true'
    runs-on: ubuntu-latest
    # Shard the suite across 4 parallel runners, 1 worker each. Cross-machine parallelism (not multiple
    # workers on one machine) keeps the realtime two-context tests free of the WS contention that made
    # them flake, while cutting wall-clock to ~1/4 of the serial run + per-job setup. fail-fast:false so
    # one shard failing still lets the others finish and report.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      # NOTE: Postgres is NOT a service container — it's started via `docker run` below so we can pass
      # `-c max_connections=300`. Service containers can't override the server command, and the default
      # ceiling (100) was too low for the parallel e2e suite (API pool + workers + F-14 export jobs +
      # many concurrent one-shot helper Prisma clients) → "FATAL: sorry, too many clients already".
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # MinIO is NOT a service container: the official minio/minio image needs `server /data`
      # (a command), which GH service containers can't pass. It's started via `docker run` below.
    env:
      # connection_limit caps the long-lived API + worker Prisma pools; combined with the raised
      # Postgres max_connections=300 (see the docker-run step above), the full e2e suite (parallel
      # workers + F-14 data-export jobs + the many one-shot helper scripts, each capped separately via
      # _e2e-prisma.js) stays comfortably under the ceiling. Uncapped pools + the old default (100)
      # exhausted it → "too many clients", dropped sockets, and partially-applied seeds.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/encre_et_plume_test?schema=public&connection_limit=10&pool_timeout=30
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-e2e-test-secret
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: encre-et-plume-media
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      CDN_BASE_URL: http://localhost:9000/encre-et-plume-media
      MEDIA_SIGNED_URL_TTL: "300"
      DISABLE_RATE_LIMIT: "true"
    steps:
      - uses: actions/checkout@v5

      - name: Guard — web app present
        id: webcheck
        run: |
          if [ -d apps/web ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; echo "::notice::apps/web not present yet — skipping e2e."; fi

      - name: Setup pnpm
        if: steps.webcheck.outputs.ok == 'true'
        uses: pnpm/action-setup@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        if: steps.webcheck.outputs.ok == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        if: steps.webcheck.outputs.ok == 'true'
        run: pnpm install --frozen-lockfile

      - name: Start Postgres (max_connections=300)
        if: steps.webcheck.outputs.ok == 'true'
        run: |
          docker run -d --name postgres -p 5432:5432 \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=encre_et_plume_test \
            postgres:16 -c max_connections=300
          # Wait until Postgres accepts connections before migrations/seed run.
          for i in $(seq 1 30); do
            if docker exec postgres pg_isready -U postgres >/dev/null 2>&1; then echo "Postgres ready"; break; fi
            echo "waiting for Postgres… ($i)"; sleep 2
          done

      - name: Start MinIO + create bucket
        if: steps.webcheck.outputs.ok == 'true'
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data
          curl -fsSL https://dl.min.io/client/mc/release/linux-amd64/mc -o /usr/local/bin/mc
          chmod +x /usr/local/bin/mc
          # Wait until MinIO is reachable (alias set succeeds), then create the public-read bucket.
          for i in $(seq 1 30); do
            if mc alias set local http://localhost:9000 minioadmin minioadmin >/dev/null 2>&1; then
              echo "MinIO ready"; break
            fi
            echo "waiting for MinIO… ($i)"; sleep 2
          done
          mc mb --ignore-existing local/encre-et-plume-media
          mc anonymous set download local/encre-et-plume-media

      - name: Apply migrations
        if: steps.webcheck.outputs.ok == 'true'
        run: pnpm --filter api exec prisma migrate deploy

      - name: Install Playwright browsers
        if: steps.webcheck.outputs.ok == 'true'
        run: pnpm --filter web exec playwright install --with-deps

      - name: Build
        if: steps.webcheck.outputs.ok == 'true'
        run: pnpm build

      # MC-1/MC-2: trouver.spec.ts and appels.spec.ts sign in as a real seeded account
      # (camille.roux@seed.encre-et-plume.local) and exercise real backend fixture data — this
      # was missing entirely from CI (only migrations were applied), so on a fresh DB the account
      # never existed and login never redirected. e2e-seed.js (below, in global-setup.ts) seeds a
      # separate set of generic qa_e2e_* accounts and does not create these fixtures.
      # Runs AFTER Build: seed.js requires @encre-et-plume/shared/dist, which only exists post-build.
      - name: Seed dev/e2e fixtures
        if: steps.webcheck.outputs.ok == 'true'
        run: pnpm --filter api exec node prisma/seed.js

      - name: Run e2e (shard ${{ matrix.shard }}/4)
        if: steps.webcheck.outputs.ok == 'true'
        run: pnpm --filter web exec playwright test --shard=${{ matrix.shard }}/4

      - name: Upload Playwright report
        if: ${{ steps.webcheck.outputs.ok == 'true' && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: "**/playwright-report"
          retention-days: 7
          if-no-files-found: ignore
