name: CI

on:
  push:
    branches: [develop, staging, main]
  pull_request:
    branches: [develop, staging, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  validate:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    outputs:
      has_app: ${{ steps.detect.outputs.has_app }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect monorepo scaffold
        id: detect
        run: |
          if [ -f pnpm-lock.yaml ] && [ -d apps ]; then
            echo "has_app=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_app=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Monorepo not scaffolded yet (no pnpm-lock.yaml / apps/). Skipping build & tests — this is expected until the first /build-story run lands code."
          fi

      - name: Setup pnpm
        if: steps.detect.outputs.has_app == 'true'
        uses: pnpm/action-setup@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        if: steps.detect.outputs.has_app == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        if: steps.detect.outputs.has_app == 'true'
        run: pnpm install --frozen-lockfile

      - name: Lint
        if: steps.detect.outputs.has_app == 'true'
        run: pnpm lint

      - name: Typecheck
        if: steps.detect.outputs.has_app == 'true'
        run: pnpm typecheck

      - name: Unit tests (Jest API + Vitest web)
        if: steps.detect.outputs.has_app == 'true'
        run: pnpm test

      - name: Build
        if: steps.detect.outputs.has_app == 'true'
        run: pnpm build

  e2e:
    name: E2E (Playwright)
    needs: validate
    if: needs.validate.outputs.has_app == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: encre_et_plume_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/encre_et_plume_test?schema=public
    steps:
      - uses: actions/checkout@v4

      - name: Guard — web app present
        id: webcheck
        run: |
          if [ -d apps/web ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; echo "::notice::apps/web not present yet — skipping e2e."; fi

      - name: Setup pnpm
        if: steps.webcheck.outputs.ok == 'true'
        uses: pnpm/action-setup@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        if: steps.webcheck.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        if: steps.webcheck.outputs.ok == 'true'
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        if: steps.webcheck.outputs.ok == 'true'
        run: pnpm --filter api exec prisma migrate deploy

      - name: Install Playwright browsers
        if: steps.webcheck.outputs.ok == 'true'
        run: pnpm --filter web exec playwright install --with-deps

      - name: Build
        if: steps.webcheck.outputs.ok == 'true'
        run: pnpm build

      - name: Run e2e
        if: steps.webcheck.outputs.ok == 'true'
        run: pnpm e2e

      - name: Upload Playwright report
        if: ${{ steps.webcheck.outputs.ok == 'true' && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: "**/playwright-report"
          retention-days: 7
          if-no-files-found: ignore
