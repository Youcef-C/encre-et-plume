services:
  # The dev database. Published on 5433 to match DIRECT_DATABASE_URL in .env — it used to be 5432,
  # which nothing pointed at, so this service had NEVER been started and the real database was a
  # hand-made `ep-postgres-test` container on an anonymous volume that no file in the repo described.
  # A fresh clone therefore got a Postgres its own app could not reach, and `docker volume prune`
  # silently destroyed the only copy of the data. Compose now owns the database, on a named volume.
  #
  # Apps talk to pgbouncer (6432), NOT here. 5433 stays published for migrations, psql and seeding —
  # Prisma Migrate needs a direct connection (see `directUrl` in schema.prisma).
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: encre_et_plume
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command:
      - postgres
      # With a pooler in front, hundreds of backends are pointless: each costs memory, and the pooler
      # caps itself at 80 (max_db_connections). The live server was at 300 with no pooler at all —
      # the anti-pattern this whole change exists to fix.
      - -c
      - max_connections=100
      # "Do not wait forever" (user, 2026-08-02). A transaction left open is the single worst way to
      # exhaust a pool: it holds its server connection until someone notices. 60s, then it is killed.
      - -c
      - idle_in_transaction_session_timeout=60000
      # Bound a runaway query rather than letting it hold a connection indefinitely.
      - -c
      - statement_timeout=30000
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d encre_et_plume"]
      interval: 5s
      timeout: 5s
      retries: 10

  # PgBouncer — mandated by ARCHITECTURE.md and CLAUDE.md, never actually deployed until now.
  # Transaction pooling; full rationale and every timeout live in infra/pgbouncer/pgbouncer.ini.
  pgbouncer:
    image: edoburu/pgbouncer:latest
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "6432:6432"
    volumes:
      - ./infra/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./infra/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # S3-compatible object storage for media (F-10). Local stand-in for AWS S3 / Cloudflare R2.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # S3 API (S3_ENDPOINT / CDN_BASE_URL)
      - "9001:9001" # web console (http://localhost:9001)
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot: create the media bucket and make it anonymous-read (public CDN-style URLs locally).
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/encre-et-plume-media &&
      mc anonymous set download local/encre-et-plume-media &&
      echo 'minio bucket ready: encre-et-plume-media';
      "

  # Local SMTP catch-all for e-mails (F-11/F-12/F-16). The API's email worker sends real
  # SMTP to :1025; every message is browsable at http://localhost:8025 (nothing leaves the box).
  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025" # SMTP (SMTP_HOST/SMTP_PORT in .env)
      - "8025:8025" # web UI (http://localhost:8025)

volumes:
  postgres_data:
  minio_data:
